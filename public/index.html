<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Finder Islamabad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <div id="splash-screen" class="splash">
        <div class="splash-content">
            <div class="cup-container">
                <div class="coffee-cup">
                    <div class="cup-body">
                        <div class="steam"><span></span><span></span><span></span></div>
                    </div>
                    <div class="cup-handle"></div>
                </div>
            </div>
            <h2>Brewing Your Experience...</h2>
        </div>
        <div class="split-bg left"></div>
        <div class="split-bg right"></div>
    </div>

    <header>
        <div class="header-title">
            <h1>☕ Cafe Finder Islamabad</h1>
            <p>Explore Top Coffee Shops & Cafes Across the Capital</p>
        </div>
        <div class="header-controls">
            <button id="themeToggleBtn" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search cafes by name or area...">
                <div class="search-actions">
                    <button id="nearMeBtn" class="action-btn">📍 Near Me</button>
                    <button id="aiSearchBtn" class="action-btn">✨ Ask AI</button>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="wifi">Wi-Fi Spots</button>
                <button class="filter-btn" data-filter="bakery">Bakeries</button>
            </div>

            <div id="statusMsg" class="status-msg" hidden></div>

            <div id="cafeList" class="cafe-list">
                <!-- populated from /api/cafes -->
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- clustering so 30+ pins don't turn into a mess when zoomed out -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyANQv90WuiLWoFDN_SN1f7KE_mIQDX-ukQ&callback=initMap"></script>
    <script src="app.js"></script>
</body>
</html>
